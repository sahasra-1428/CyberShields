    <div class="main-wrapper">
      <header class="topbar">
        <div class="topbar-left">
          <button class="mobile-toggle" onclick="document.querySelector('.sidebar').classList.toggle('open');">☰</button>
          <h2 class="page-heading">Citizen Account Settings</h2>
        </div>
      </header>

      <main class="dashboard-content">
        <div style="max-width: 800px; margin: 0 auto;">
          <!-- Profile Card -->
          <div class="card" style="margin-bottom: 24px;">
            <h3 style="font-size:1.25rem; margin-bottom: 16px;">Account Details</h3>

            <form id="profile-form">
              <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px;">
                <div class="form-group" style="margin-bottom:0;">
                  <label class="form-label">Full Name</label>
                  <input type="text" class="form-input" id="profile-name" required>
                </div>
                <div class="form-group" style="margin-bottom:0;">
                  <label class="form-label">Email Address (Read-only)</label>
                  <input type="email" class="form-input" id="profile-email" disabled style="opacity:0.7;">
                </div>
              </div>

              <div class="form-group">
                <label class="form-label">Phone Number</label>
                <input type="tel" class="form-input" id="profile-phone" placeholder="+91 9876543210">
              </div>

              <button type="submit" class="btn btn-primary btn-sm">Update Contact Details</button>
            </form>
          </div>

          <!-- Password Reset Card -->
          <div class="card">
            <h3 style="font-size:1.25rem; margin-bottom: 16px;">Change Master Password</h3>

            <form id="password-form">
              <div class="form-group">
                <label class="form-label">Current Password</label>
                <input type="password" class="form-input" id="current-password" required autocomplete="current-password">
              </div>

              <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px;">
                <div class="form-group" style="margin-bottom:0;">
                  <label class="form-label">New Password</label>
                  <input type="password" class="form-input" id="new-password" required autocomplete="new-password">
                </div>
                <div class="form-group" style="margin-bottom:0;">
                  <label class="form-label">Confirm New Password</label>
                  <input type="password" class="form-input" id="confirm-new-password" required autocomplete="new-password">
                </div>
              </div>

              <button type="submit" class="btn btn-outline btn-sm">Update Security Password</button>
            </form>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      if (!Auth.requireAuth()) return;

      try {
        const res = await apiFetch('/api/auth/me');
        if (res.success && res.user) {
          document.getElementById('profile-name').value = res.user.name || '';
          document.getElementById('profile-email').value = res.user.email || '';
          document.getElementById('profile-phone').value = res.user.phone || '';
        }
      } catch (err) {
        showToast(err.message, 'error');
      }

      // Profile details update
      document.getElementById('profile-form')?.addEventListener('submit', async (e) => {
        e.preventDefault();
        const name = document.getElementById('profile-name').value.trim();
        const phone = document.getElementById('profile-phone').value.trim();

        try {
          const res = await apiFetch('/api/auth/profile', {
            method: 'PUT',
            body: { name, phone }
          });
          if (res.success) {
            showToast('Account details updated successfully.', 'success');
            const currentUser = Auth.getUser();
            if (currentUser) {
              currentUser.name = name;
              currentUser.phone = phone;
              Auth.setUser(currentUser);
            }
          }
        } catch (err) {
          showToast(err.message, 'error');
        }
      });

      // Password change form
      document.getElementById('password-form')?.addEventListener('submit', async (e) => {
        e.preventDefault();
        const currentPassword = document.getElementById('current-password').value;
        const newPassword = document.getElementById('new-password').value;
        const confirmNew = document.getElementById('confirm-new-password').value;

        if (newPassword !== confirmNew) {
          showToast('New passwords do not match.', 'error');
          return;
        }

        try {
          const res = await apiFetch('/api/auth/profile', {
            method: 'PUT',
            body: { currentPassword, newPassword }
          });
          if (res.success) {
            showToast('Password updated successfully.', 'success');
            e.target.reset();
          }
        } catch (err) {
          showToast(err.message, 'error');
        }
      });
    });
  </script>
